name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_35_2
      - develop
  pull_request:
    branches:
      - develop
      - main

env:
  POSTGRES_DB: lmsdb
  POSTGRES_USER: lmsuser
  POSTGRES_PASSWORD: lmspass

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ vars.POSTGRES_PASSWORD }}
      SECRET_KEY: ${{ vars.SECRET_KEY }}

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ vars.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy .env for testing
        run: |
          echo "SECRET_KEY=${SECRET_KEY}" > .env
          echo "POSTGRES_DB_NAME=${POSTGRES_DB}" >> .env
          echo "POSTGRES_DB_USER=${POSTGRES_USER}" >> .env
          echo "POSTGRES_DB_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "POSTGRES_DB_HOST=localhost" >> .env
          echo "POSTGRES_DB_PORT=5432" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ vars.POSTGRES_USER }} -d ${{ vars.POSTGRES_DB }}; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Apply migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          python manage.py test

      - name: Run linter (flake8)
        run: |
          flake8 . --exclude=*.pyc