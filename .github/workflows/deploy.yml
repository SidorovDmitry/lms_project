name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_35_2
      - develop
  pull_request:
    branches:
      - develop
      - main

env:
  POSTGRES_DB: lmsdb
  POSTGRES_USER: lmsuser
  POSTGRES_PASSWORD: lmspass

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy .env for testing
        run: |
          cp .env.sample .env || echo "Using defaults"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }}; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Apply migrations
        run: |
          python manage.py migrate
        working-directory: .

      - name: Run tests
        run: |
          python manage.py test
        working-directory: .

      - name: Run linter (flake8)
        run: |
          flake8 . --exclude=*.pyc
        working-directory: .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "🚀 Deploying to production"

            if [ ! -d "/home/${SSH_USERNAME}/projects/lms_project" ]; then
              echo "❌ Directory not found. Clone manually first."
              exit 1
            fi

            cd /home/${SSH_USERNAME}/projects/lms_project

            echo "💾 Stashing local changes..."
            git stash --all || true

            echo "🔄 Switching to ${GITHUB_REF#refs/heads/}"
            git fetch origin
            git checkout ${GITHUB_REF#refs/heads/}

            echo "📥 Pulling latest changes"
            git pull origin ${GITHUB_REF#refs/heads/} --force-with-lease

            echo "🛑 Stopping containers"
            docker compose down

            echo "🧹 Cleaning Docker builder cache"
            docker builder prune -f --filter "until=1h" || true

            echo "🏗️ Building and starting services"
            docker compose up -d --build --force-recreate

            echo "🔧 Running migrations"
            docker compose exec -T web python manage.py migrate --noinput

            echo "📦 Collecting static files"
            docker compose exec -T web python manage.py collectstatic --noinput --clear

            echo "✅ Deploy completed successfully"

      - name: Notify Success (Telegram)
        if: success()
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy succeeded!
            🚀 Branch: `${{ github.ref_name }}`
            🔗 [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Failure (Telegram)
        if: failure()
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deploy failed!
            🚨 Branch: `${{ github.ref_name }}`
            🔗 [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})