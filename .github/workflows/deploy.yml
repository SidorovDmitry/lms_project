name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_35_2  # ✅ Теперь везде одна ветка

env:
  # Общие переменные
  POSTGRES_DB: lmsdb
  POSTGRES_USER: lmsuser
  POSTGRES_PASSWORD: lmspass

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker
        uses: docker/setup-docker@v3
        with:
          compose-version: v2.26.1

      - name: Copy .env for testing
        run: |
          cp .env.sample .env || echo "Using defaults"

      - name: Build and start db + redis
        run: |
          docker compose -f docker-compose.yml up -d db redis

      - name: Wait for PostgreSQL
        run: |
          until docker exec $(docker ps -q -f name=db) pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Apply migrations
        run: |
          docker compose -f docker-compose.yml run --rm web python manage.py migrate

      - name: Run tests
        run: |
          docker compose -f docker-compose.yml run --rm web python manage.py test

      - name: Run linter (flake8)
        run: |
          docker compose -f docker-compose.yml run --rm web flake8 . --exclude=*.pyc

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production  # Позволяет настроить approval (опционально)
    concurrency: production  # Защита от параллельных деплоев

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.0  # ✅ Вместо @master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Останавливаемся при ошибке

            echo "🚀 Deploying to production"

            # Проверяем, что папка существует
            if [ ! -d "/home/${SSH_USERNAME}/projects/lms_project" ]; then
              echo "❌ Directory ~/projects/lms_project not found. Clone manually first."
              exit 1
            fi

            cd /home/${SSH_USERNAME}/projects/lms_project

            # Сохраняем локальные изменения (если есть)
            echo "💾 Stashing any local changes..."
            git stash --all || true

            # Переключаемся на нужную ветку
            echo "SetBranch to feature_35_2"
            git fetch origin
            git checkout feature_35_2

            echo "📥 Pulling latest changes"
            git pull origin feature_35_2

            echo "🛑 Stopping containers"
            docker compose down

            echo "🏗️ Building and starting services"
            docker compose up -d --build

            echo "🔧 Running migrations"
            docker compose exec -T web python manage.py migrate --noinput

            echo "📦 Collecting static files"
            docker compose exec -T web python manage.py collectstatic --noinput --clear

            echo "✅ Deploy completed successfully"