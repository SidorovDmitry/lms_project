name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_35_2
      - develop
  pull_request:
    branches:
      - develop
      - main

env:
  POSTGRES_DB: lmsdb
  POSTGRES_USER: lmsuser
  POSTGRES_PASSWORD: lmspass

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy .env for testing
        run: |
          cp .env.sample .env || echo "Using defaults"

      - name: Build and start db only
        run: |
          docker compose -f docker-compose.yml up -d db

      - name: Wait for PostgreSQL
        run: |
          until docker exec $(docker ps -q -f name=db) pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Apply migrations
        run: |
          docker compose -f docker-compose.yml run --rm web python manage.py migrate

      - name: Run tests
        run: |
          docker compose -f docker-compose.yml run --rm web python manage.py test

      - name: Run linter (flake8)
        run: |
          docker compose -f docker-compose.yml run --rm web flake8 . --exclude=*.pyc

  deploy:
    if: github.ref == 'refs/heads/feature_35_2'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Deploying to PRODUCTION"

            cd /home/${SSH_USERNAME}/projects/lms_project || {
              echo "❌ Directory not found. Clone manually first."
              exit 1
            }

            git stash --all || true
            git fetch origin
            git checkout feature_35_2
            git pull origin feature_35_2

            docker compose down
            docker compose up -d --build

            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput --clear

            echo "✅ Production deploy complete"

      - name: Notify via Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Production deploy complete!
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Deploying to STAGING"

            cd /home/${SSH_USERNAME}/projects/lms_project || {
              echo "❌ Directory not found. Clone manually first."
              exit 1
            }

            git stash --all || true
            git fetch origin
            git checkout develop
            git pull origin develop

            docker compose down
            docker compose up -d --build

            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput --clear

            echo "✅ Staging deploy complete"

      - name: Notify via Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🧪 Staging deploy complete!
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run linter
        run: |
          flake8 . --exclude=*.pyc

      - name: Run tests
        run: |
          python manage.py test
