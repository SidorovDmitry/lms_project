name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_35_2

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Wait for Redis
        run: |
          until redis-cli -h localhost -p 6379 PING | grep -q "PONG"; do
            echo "⏳ Waiting for Redis..."
            sleep 5
          done
          echo "✅ Redis is ready!"

      - name: Apply migrations
        env:
          DEBUG: True
          SECRET_KEY: django-insecure-for-test-only
          ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB_NAME: ${{ secrets.DB_NAME }}
          POSTGRES_DB_USER: ${{ secrets.DB_USER }}
          POSTGRES_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB_HOST: localhost
          POSTGRES_DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Run tests
        env:
          DEBUG: True
          SECRET_KEY: django-insecure-for-test-only
          ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB_NAME: ${{ secrets.DB_NAME }}
          POSTGRES_DB_USER: ${{ secrets.DB_USER }}
          POSTGRES_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB_HOST: localhost
          POSTGRES_DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py test

      - name: Run linter
        run: |
          flake8 . --exit-zero --exclude=*.pyc

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature_35_2'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/projects/lms_project
            git fetch origin
            git checkout feature_35_2
            git reset --hard origin/feature_35_2
            docker compose down --remove-orphans
            docker compose up -d --build --force-recreate
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput --clear

            # Проверка состояния сервисов
            echo "📊 Checking container status..."
            if ! docker compose ps | grep -q "Up"; then
              echo "❌ One or more services failed to start"
              docker compose logs --tail=50
              exit 1
            fi

            echo "✅ Deploy completed successfully!"